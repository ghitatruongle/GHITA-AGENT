[package]
name = "ghita-coding-agent"
version = "1.2.0-demo1"
description = "GHITA CODING AGENT Desktop"
authors = ["ghitatruongle"]
edition = "2021"

[lib]
name = "ghita_coding_agent_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sidecar port model: uses a dynamic or fixed port allocated in sidecar configuration or environment variables.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.13", features = ["json"] }
local-ip-address = "0.6"
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

# Phase 1: Computer-Use Rust backend (native screenshot + input + image resize)
screenshots = "0.8"
enigo = "0.2"
image = "0.24"
base64 = "0.22"

# Phase 2: Native PTY terminal (replaces node-pty sidecar)
portable-pty = "0.8"
dashmap = "6"

# Security & Utils
rand = "0.8"
percent-encoding = "2.3"
chrono = { version = "0.4", features = ["serde"] }
# v0.4.8 B2 (M8): verify integrity of the bundled node runtime before spawn.
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
# Sidecar death-sentence: the child node process is placed in a JobObject with
# KILL_ON_JOB_CLOSE so that killing the app (close/crash/force-kill) always
# reaps the sidecar instead of leaving an orphan holding the HTTP/gRPC ports.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# v0.4.8 B1: Optimized release profile for Windows/desktop binaries.
# Smaller, faster binary at the cost of longer compile time.
# BUILD NOTE: on this machine, compile with `RUST_MIN_STACK=134217728` and
# `CARGO_BUILD_JOBS=1` to avoid rustc STATUS_STACK_BUFFER_OVERRUN crashes
# (stack overflow on heavy crates + antivirus parallel-write races).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
