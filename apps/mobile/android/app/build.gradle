apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    root = file("../../")

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true
// BUILD (audit fix 4.6): broaden release-task detection so `./gradlew assemble`
// and `./gradlew install*` tasks also enable signing validation. Previously
// only `release`/`bundle` matched; everything else skipped the guard and the
// build crashed with a confusing "storeFile not configured" error.
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def n = taskName.toLowerCase()
    n.contains("release") ||
        n.contains("bundle") ||
        n.contains("assemble") ||
        n.contains("install")
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ghitamobile"

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    defaultConfig {
        applicationId "com.ghitamobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.0-preview"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Read from environment variables or gradle.properties
            def releaseKeystorePath = System.getenv("GHITA_RELEASE_KEYSTORE_PATH") ?: project.findProperty("GHITA_RELEASE_KEYSTORE_PATH") ?: ""
            def releaseKeystorePassword = System.getenv("GHITA_RELEASE_KEYSTORE_PASSWORD") ?: project.findProperty("GHITA_RELEASE_KEYSTORE_PASSWORD") ?: ""
            def releaseKeyAlias = System.getenv("GHITA_RELEASE_KEY_ALIAS") ?: project.findProperty("GHITA_RELEASE_KEY_ALIAS") ?: ""
            def releaseKeyPassword = System.getenv("GHITA_RELEASE_KEY_PASSWORD") ?: project.findProperty("GHITA_RELEASE_KEY_PASSWORD") ?: ""

            if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else if (isReleaseTaskRequested && System.getenv("CI")?.toBoolean() && !System.getenv("GHITA_CI_UNSIGNED")?.toBoolean()) {
                // CI must fail by default when signing secrets are missing so a release is
                // never published unsigned by accident. Workflows that explicitly opt in
                // (GHITA_CI_UNSIGNED=true, e.g. verification builds while ANDROID_KEYSTORE_*
                // secrets are not configured yet) fall through to the debug-keystore path.
                throw new GradleException("Release signing secrets are required in CI")
            } else if (isReleaseTaskRequested) {
                // Local-only / explicitly-unsigned fallback: proves the release pipeline
                // compiles without exposing production signing material. CI may only take
                // this branch when GHITA_CI_UNSIGNED=true was set on purpose.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
