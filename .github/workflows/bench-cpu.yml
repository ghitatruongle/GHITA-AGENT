name: bench-cpu

on:
  schedule:
    - cron: '0 4 * * *' # nightly
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/security/**'
      - 'packages/ingest/**'
      - 'packages/code-graph/**'
      - 'packages/native-bridge/**'
      - 'crates/**'
      - 'scripts/bench-*.mjs'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Build code-graph (bench imports dist/ast-parser.js)
        run: pnpm --filter @ghita/code-graph... build

      - name: CPU benchmark + regression gate (JS)
        run: node scripts/bench-cpu.mjs --baseline

      - name: Rust cores (cargo test)
        uses: dtolnay/rust-toolchain@master
      - run: cargo test --workspace
        working-directory: crates
        env:
          RUST_MIN_STACK: 134217728
          CARGO_BUILD_JOBS: 1

      - name: Build native addons (secscan/retrieval/codegraph)
        run: |
          npm i -g @napi-rs/cli@3.7.0
          for c in secscan retrieval codegraph; do
            napi build --cwd crates/$c --platform --release --features addon --output-dir crates/$c
          done

      - name: Native benchmark
        run: node scripts/bench-native.mjs

      - name: Upload bench reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-bench
          path: |
            docs/perf-baseline.json
            docs/perf-native.json
