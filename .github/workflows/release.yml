name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.5.2

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches canonical version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: pnpm integrity
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Generate fresh T0/T1 coverage
        run: |
          pnpm --filter @ghita/security test:coverage
          pnpm --filter @ghita/agents test:coverage
          pnpm --filter @ghita/communication test:coverage
          pnpm --filter @ghita/ai-engine test:coverage
          pnpm --filter @ghita/memory test:coverage
          pnpm --filter @ghita/skills test:coverage
      - name: Enforce T0/T1 coverage floors
        run: node scripts/check-coverage-tiers.mjs --tiers=T0,T1 --require-summaries
      - run: pnpm audit:policy
      - run: pnpm licenses:check
      - run: pnpm knip --no-progress
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Run native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: pnpm build:packages
      - run: pnpm --filter @ghita/desktop build
      - run: pnpm build:docs
      - run: pnpm --filter @ghita/docs build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start built desktop web server
        run: |
          pnpm --filter @ghita/desktop preview --host 0.0.0.0 --port 1420 > /tmp/ghita-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:1420/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ghita-vite.log
          exit 1
      - name: Run blocking browser smoke tests
        run: pnpm exec playwright test tests/e2e/playwright-smoke.test.ts
        env:
          E2E_BASE_URL: http://localhost:1420

  create-release:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build signed desktop artifacts
        working-directory: apps/desktop
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Create Windows updater record
        run: >
          node scripts/updater-manifest.mjs record
          --platform windows-x86_64
          --assets-dir apps/desktop/src-tauri/target/release/bundle
          --suffix "-setup.exe"
          --output updater-records/windows-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: updater-record-windows-x86_64
          path: updater-records/windows-x86_64.json
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build signed desktop artifacts
        working-directory: apps/desktop
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Create Linux updater record
        run: >
          node scripts/updater-manifest.mjs record
          --platform linux-x86_64
          --assets-dir apps/desktop/src-tauri/target/release/bundle
          --suffix .AppImage
          --output updater-records/linux-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: updater-record-linux-x86_64
          path: updater-records/linux-x86_64.json
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig

  build-macos:
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            platform: darwin-x86_64
          - target: aarch64-apple-darwin
            platform: darwin-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Build signed desktop artifacts
        working-directory: apps/desktop
        # `app` must be a declared bundle so Tauri keeps the .app and emits the
        # .app.tar.gz updater artifact even when cross-targeting (host arch
        # differs from the target triple) — otherwise only the dmg survives.
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Ensure macOS updater tarball signature
        # Defensive: when the target arch equals the host, Tauri already
        # produced the .tar.gz + .sig. When it did not (older Tauri versions
        # skip the updater artifact on cross-target builds), create + sign it
        # manually so the updater record always has one artifact.
        run: |
          set -euo pipefail
          APP_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          TARBALL="${APP_DIR}/Ghita Agent.app.tar.gz"
          if [ ! -f "${TARBALL}" ]; then
            mkdir -p "${APP_DIR}"
            tar -C "${APP_DIR}" -czf "${TARBALL}" "Ghita Agent.app"
          fi
          if [ ! -f "${TARBALL}.sig" ]; then
            pnpm --filter @ghita/desktop tauri sign \
              --private-key "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" \
              --password "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" \
              --file "${TARBALL}"
          fi
      - name: Create macOS updater record
        run: >
          node scripts/updater-manifest.mjs record
          --platform ${{ matrix.platform }}
          --assets-dir apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          --suffix .app.tar.gz
          --output updater-records/${{ matrix.platform }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: updater-record-${{ matrix.platform }}
          path: updater-records/${{ matrix.platform }}.json
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghita/shared build
      - name: Decode release keystore
        # The `secrets` context is not available in `if:` expressions — expose
        # it through the step env first, then gate on the env value.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/ghita-release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build signed Android APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: pnpm --filter @ghita/mobile build:release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GHITA_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/ghita-release.keystore
          GHITA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GHITA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GHITA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Generate debug keystore for unsigned build
        # debug.keystore is gitignored (see root .gitignore), so CI must
        # create it on the fly for the unsigned release build fallback.
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build unsigned Android APK (no signing secrets configured)
        # ANDROID_KEYSTORE_* secrets are not set in this repository yet, so the
        # release pipeline is verified with a debug-signed APK (explicit opt-in
        # via GHITA_CI_UNSIGNED, see app/build.gradle). Once the secrets exist
        # the two steps above take over automatically and sign the APK.
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: pnpm --filter @ghita/mobile build:release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GHITA_CI_UNSIGNED: "true"
      - uses: softprops/action-gh-release@v2
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        with:
          fail_on_unmatched_files: true
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk

  build-ios:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghita/shared build
      - name: Install Pods
        working-directory: apps/mobile/ios
        # pod install intermittently fails with "pathname contains null byte"
        # on GitHub runners for pnpm monorepos (CocoaPods #12798, #12866);
        # retry a few times before giving up.
        # (The fmt Xcode 26 compile workaround lives in the Podfile's
        # post_install hook — see apps/mobile/ios/Podfile.)
        run: |
          for attempt in 1 2 3; do
            echo "pod install attempt ${attempt}/3"
            if pod install; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Build unsigned iOS CI artifact
        working-directory: apps/mobile/ios
        # Xcode script phases (e.g. "Bundle React Native code and images") run
        # with a sanitized PATH that does not include the runner's Node — expose
        # it explicitly or the bundle step dies with exit 65 on CI. A generic
        # destination also makes the arch selection deterministic and script
        # sandboxing is disabled so the RN phases can write outside the sandbox.
        run: |
          export PATH="$(dirname "$(command -v node)"):$PATH"
          xcodebuild -workspace GhitaMobile.xcworkspace \
            -scheme GhitaMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: |
            apps/mobile/ios/build/Build/Products/*/*.app
            apps/mobile/ios/build/Build/Products/*/*.app.dSYM
          if-no-files-found: error
          retention-days: 30

  generate-updater-json:
    # Only desktop bundles produce updater records (.sig); Android/iOS attach
    # to the release directly and must not block latest.json + publish.
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-record-*
          path: updater-records
          merge-multiple: true
      - name: Generate verified updater manifest
        run: >
          node scripts/updater-manifest.mjs manifest
          --records-dir updater-records
          --output latest.json
          --version "${GITHUB_REF_NAME#v}"
          --repository "${GITHUB_REPOSITORY}"
          --tag "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: latest.json

  publish-release:
    needs: generate-updater-json
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
