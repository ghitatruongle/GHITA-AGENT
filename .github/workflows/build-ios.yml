name: Build iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Install Rust (for native deps if needed)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ghita/shared build

      - name: Install Pods
        working-directory: apps/mobile/ios
        # pod install intermittently fails with "pathname contains null byte"
        # on GitHub runners for pnpm monorepos (CocoaPods #12798, #12866);
        # retry a few times before giving up.
        # (The fmt Xcode 26 compile workaround lives in the Podfile's
        # post_install hook — see apps/mobile/ios/Podfile.)
        run: |
          for attempt in 1 2 3; do
            echo "pod install attempt ${attempt}/3"
            if pod install; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Typecheck mobile
        run: pnpm --filter @ghita/mobile typecheck
        continue-on-error: true

      - name: Lint mobile
        run: pnpm --filter @ghita/mobile lint
        continue-on-error: true

      - name: Run mobile tests
        run: pnpm --filter @ghita/mobile test
        continue-on-error: true

      - name: Build iOS (${{ github.event.inputs.build_type || 'debug' }})
        working-directory: apps/mobile/ios
        # Same CI hardening as release.yml: Xcode script phases need Node on
        # PATH, a generic destination makes arch selection deterministic, and
        # script sandboxing is disabled for the RN build phases. x86_64 is
        # excluded from the simulator build because Xcode 26's toolchain no
        # longer ships the swiftCompatibility56 shim for the x86_64 slice
        # (link fails with "Undefined symbols: __swift_FORCE_LOAD_$_swiftCompatibility56").
        run: |
          export PATH="$(dirname "$(command -v node)"):$PATH"
          if [ "${{ github.event.inputs.build_type || 'debug' }}" = "release" ]; then
            xcodebuild -workspace GhitaMobile.xcworkspace \
              -scheme GhitaMobile \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              ENABLE_USER_SCRIPT_SANDBOXING=NO
          else
            xcodebuild -workspace GhitaMobile.xcworkspace \
              -scheme GhitaMobile \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              EXCLUDED_ARCHS=x86_64 \
              ENABLE_USER_SCRIPT_SANDBOXING=NO
          fi

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            apps/mobile/ios/build/Build/Products/*/*.app
            apps/mobile/ios/build/Build/Products/*/*.app.dSYM
          retention-days: 14
